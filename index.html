        <script>
            (function () {
                const key = 'THEME';
                let theme = localStorage.getItem(key);

                if (theme !== 'dark' && theme !== 'light') {
                    theme = 'dark';
                    localStorage.setItem(key, theme);
                }

                document.documentElement.setAttribute('data-theme', theme);
            })();
        </script>

        <script>
            (function (location) {
                if (location.search[1] !== '/') return;

                var decodedRoute = location.search
                    .slice(1)
                    .split('&')
                    .map(function (segment) {
                        return segment.replace(/~and~/g, '&');
                    })
                    .join('?');

                window.history.replaceState(null, null, location.pathname.slice(0, -1) + decodedRoute + location.hash);
            })(window.location);
        </script>
